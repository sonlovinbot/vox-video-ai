<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>VOX overlay</title>
    <script src="gsap.min.js"></script>
    <style>
      /* Font nhúng tại chỗ, KHÔNG lấy từ CDN: render trong sandbox hoặc trên
         Railway không ra được internet, font hỏng thì chữ thành ô vuông. Subset
         vietnamese phải khai TRƯỚC latin để dấu tiếng Việt được ưu tiên. */
      @font-face { font-family: "Be Vietnam Pro"; font-weight: 600; font-display: block;
        src: url("fonts/bvp-600-vietnamese.woff2") format("woff2");
        unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
      @font-face { font-family: "Be Vietnam Pro"; font-weight: 600; font-display: block;
        src: url("fonts/bvp-600-latin.woff2") format("woff2"); }
      @font-face { font-family: "Be Vietnam Pro"; font-weight: 800; font-display: block;
        src: url("fonts/bvp-800-vietnamese.woff2") format("woff2");
        unicode-range: U+0102-0103,U+0110-0111,U+0128-0129,U+0168-0169,U+01A0-01A1,U+01AF-01B0,U+0300-0301,U+0303-0304,U+0308-0309,U+0323,U+0329,U+1EA0-1EF9,U+20AB; }
      @font-face { font-family: "Be Vietnam Pro"; font-weight: 800; font-display: block;
        src: url("fonts/bvp-800-latin.woff2") format("woff2"); }
      /* Lớp phủ trong suốt: cover, HUD và caption karaoke.
         Nền PHẢI trong suốt — ffmpeg sẽ chồng lớp này lên video đã ghép, nên mọi
         pixel không có chữ đều phải là alpha 0. */
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: transparent; }
      #root {
        position: relative; width: 1080px; height: 1920px; background: transparent;
        font-family: "Be Vietnam Pro", system-ui, sans-serif; overflow: hidden;
      }

      /* Grade: cùng gradient với preview, để chữ luôn đủ tương phản. */
      .grade { position: absolute; inset: 0; }

      .hud { position: absolute; top: 68px; left: 80px; right: 80px; display: flex; flex-direction: column; gap: 22px; }
      .pills { display: flex; gap: 10px; }
      .pills i { flex: 1; height: 10px; border-radius: 6px; background: rgba(255,255,255,0.16); }
      .pills i.done { background: rgba(255,255,255,0.42); }
      .pills i.active { background: #ffd400; }

      .chapter { display: flex; align-items: center; gap: 18px; }
      .chapter b { padding: 6px 18px; border-radius: 10px; background: #ffd400; color: #08080c; font-size: 30px; font-weight: 800; }
      .chapter span { color: #fff; font-size: 27px; font-weight: 700; letter-spacing: 0.13em; text-transform: uppercase; }

      .cover { position: absolute; top: 300px; left: 80px; right: 150px; display: flex; flex-direction: column; align-items: flex-start; gap: 22px; }
      .cover .eyebrow { padding: 10px 22px; border-radius: 10px; background: #ffd400; color: #08080c; font-size: 26px; font-weight: 800; letter-spacing: 0.16em; text-transform: uppercase; }
      .cover h2 { color: #fff; font-size: 92px; font-weight: 800; line-height: 1.1; letter-spacing: -0.015em; text-shadow: 0 8px 42px rgba(0,0,0,0.8); }

      .caption { position: absolute; left: 60px; right: 60px; bottom: 210px; display: flex; justify-content: center; }
      .caption .pill {
        display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 0 18px;
        padding: 22px 40px; border-radius: 22px; background: rgba(20,16,20,0.72);
        font-size: 52px; font-weight: 800; line-height: 1.32; text-align: center;
      }
      .caption .pill span { color: rgba(255,255,255,0.45); }
      .caption .pill span.spoken { color: #fff; }
      .caption .pill span.active { color: #ffd400; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="10"
      data-width="1080"
      data-height="1920"
      data-composition-variables='{"durationSec":10,"grade":true,"coverEyebrow":"GIẢI THÍCH","coverTitle":"Hành trình đơn hàng 39K","coverSeconds":3.2,"chapters":[],"phrases":[]}'
    >
      <div class="grade"></div>
      <div class="cover" style="display:none"><span class="eyebrow"></span><h2></h2></div>
      <div class="hud"><div class="pills"></div><div class="chapter"><b></b><span></span></div></div>
      <div class="caption" style="display:none"><span class="pill"></span></div>
    </div>

    <script>
      (function () {
        var v = (window.__hyperframes && window.__hyperframes.getVariables)
          ? window.__hyperframes.getVariables() : {};
        var chapters = Array.isArray(v.chapters) ? v.chapters : [];
        var phrases = Array.isArray(v.phrases) ? v.phrases : [];

        if (v.grade !== false) {
          document.querySelector(".grade").style.background =
            "linear-gradient(180deg, rgba(8,8,12,0.72) 0%, rgba(8,8,12,0) 22%, rgba(8,8,12,0) 44%, rgba(8,8,12,0.78) 82%, rgba(8,8,12,0.94) 100%)," +
            "radial-gradient(ellipse at 50% 45%, rgba(0,0,0,0) 46%, rgba(0,0,0,0.5) 100%)";
        }

        var pills = document.querySelector(".pills");
        chapters.forEach(function () { pills.appendChild(document.createElement("i")); });

        var coverEl = document.querySelector(".cover");
        if (v.coverTitle) {
          coverEl.querySelector(".eyebrow").textContent = v.coverEyebrow || "";
          if (!v.coverEyebrow) coverEl.querySelector(".eyebrow").style.display = "none";
          coverEl.querySelector("h2").textContent = v.coverTitle;
        }

        var capEl = document.querySelector(".caption");
        var pillEl = capEl.querySelector(".pill");

        function draw(t) {
          coverEl.style.display = (v.coverTitle && t < (v.coverSeconds || 0)) ? "flex" : "none";

          var active = -1;
          chapters.forEach(function (c, i) { if (t >= c.start && t < c.end) active = i; });
          if (active < 0 && chapters.length && t >= chapters[chapters.length - 1].end) {
            active = chapters.length - 1;
          }
          Array.prototype.forEach.call(pills.children, function (el, i) {
            el.className = i === active ? "active" : (i < active ? "done" : "");
          });
          var ch = chapters[active < 0 ? 0 : active];
          document.querySelector(".chapter b").textContent =
            ch ? String(ch.index).padStart(2, "0") : "";
          document.querySelector(".chapter span").textContent = ch ? ch.label : "";

          var ph = null;
          for (var i = 0; i < phrases.length; i++) {
            if (t >= phrases[i].start && t <= phrases[i].end + 0.2) { ph = phrases[i]; break; }
          }
          if (!ph) { capEl.style.display = "none"; return; }
          capEl.style.display = "flex";
          pillEl.innerHTML = "";
          (ph.words && ph.words.length ? ph.words : [{ text: ph.text, start: ph.start, end: ph.end }])
            .forEach(function (w) {
              var s = document.createElement("span");
              s.textContent = w.text;
              s.className = (t >= w.start && t <= w.end) ? "active" : (t > w.end ? "spoken" : "");
              pillEl.appendChild(s);
            });
        }

        /**
         * HyperFrames tua một GSAP timeline ĐANG PAUSED theo từng frame, chứ
         * không chạy animation theo đồng hồ thật. Nên toàn bộ trạng thái phải
         * vẽ lại từ tl.time() trong onUpdate — như vậy frame nào cũng tất định,
         * render lại bao nhiêu lần cũng ra đúng một kết quả.
         */
        var slot = Number(v.durationSec) || 10;
        var tl = gsap.timeline({ paused: true });
        tl.to({}, { duration: slot, onUpdate: function () { draw(tl.time()); } }, 0);
        window.__timelines = window.__timelines || {};
        window.__timelines["main"] = tl;
        draw(0);
      })();
    </script>
  </body>
</html>
